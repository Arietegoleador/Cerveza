<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f1830">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Consumo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Consumo</title>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">CONTROL DE CONSUMO</div>
        <h1>🍺 Consumo</h1>
      </div>
      <button class="icon-btn" id="todayBtn" aria-label="Ir a hoy">Hoy</button>
    </header>

    <section id="view-home" class="view active">
      <div class="hero-card card">
        <div class="card-label">HOY</div>
        <div class="big-number" id="todayTotal">0 <span>cl</span></div>
        <div class="muted" id="todayDate"></div>
      </div>

      <div class="card week-card">
        <div class="section-head">
          <div>
            <div class="card-label">ESTA SEMANA</div>
            <div class="metric" id="weekTotal">0 <span>cl</span></div>
          </div>
          <div class="comparison" id="weekComparison">—</div>
        </div>
        <div class="chart-wrap"><canvas id="weekChart"></canvas></div>
        <div class="chart-days" id="weekDays"></div>
        <div class="compare-line">
          <span>Media histórica semanal</span>
          <strong id="historicalAvg">—</strong>
        </div>
      </div>

      <button class="primary-btn" id="addBtn">＋ Añadir consumo</button>
    </section>

    <section id="view-stats" class="view">
      <div class="segmented">
        <button class="seg active" data-tab="weekly">Semana</button>
        <button class="seg" data-tab="monthly">Mes</button>
        <button class="seg" data-tab="records">Récords</button>
      </div>
      <div id="statsContent"></div>
    </section>

    <section id="view-history" class="view">
      <div class="section-title">
        <div>
          <div class="eyebrow">REGISTROS</div>
          <h2>Histórico</h2>
        </div>
        <button class="small-btn" id="historyAddBtn">＋ Añadir</button>
      </div>
      <div id="historyList"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="home"><span>⌂</span><small>Inicio</small></button>
    <button class="nav-item" data-view="stats"><span>▥</span><small>Estadísticas</small></button>
    <button class="nav-item" data-view="history"><span>☷</span><small>Histórico</small></button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close-btn" id="closeModal">×</button>
      <div class="eyebrow">REGISTRO</div>
      <h2 id="modalTitle">Añadir consumo</h2>
      <div class="field-label">Cantidad</div>
      <div class="quick-grid">
        <button class="quick" data-value="20">20 cl</button>
        <button class="quick" data-value="25">25 cl</button>
        <button class="quick" data-value="33">33 cl</button>
        <button class="quick" data-value="50">50 cl</button>
      </div>
      <label class="custom-field">Otra cantidad
        <input id="amountInput" type="number" inputmode="decimal" min="1" step="1" placeholder="cl">
      </label>
      <label class="custom-field">Fecha
        <input id="dateInput" type="date">
      </label>
      <div class="modal-actions">
        <button class="secondary-btn" id="cancelBtn">Cancelar</button>
        <button class="primary-btn compact" id="saveBtn">Guardar</button>
      </div>
      <button class="delete-btn" id="deleteBtn" hidden>Eliminar registro</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
